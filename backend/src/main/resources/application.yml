server:
  port: ${PORT:7070}
  error:
    include-message: always
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/partyinvite;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
brevo:
  api-key: ${BREVO_API_KEY:}
mail:
  from: ${MAIL_FROM:vermashubham16385@gmail.com}
  from-name: ${MAIL_FROM_NAME:PartyInvite}
